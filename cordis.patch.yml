- insert:
    - id: atlassian-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: atlassian
        transport: stdio
        command: npx
        args:
          - -y
          - mcp-remote@0.16.6
          - https://mcp.atlassian.com/v1/mcp/authv2
        failOnStartupError: false
